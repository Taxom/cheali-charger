name: Build firmware for Nuvoton

# AVR B6 builds run automatically; legacy ARM builds remain available on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:    
      - name: Install Packages
        run: | 
            sudo apt-get install -y git cmake openocd gcc-arm-none-eabi 

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Project
        run: | 
            git submodule init
            git submodule update
            cmake . -DCMAKE_TOOLCHAIN_FILE=arm-toolchain.cmake -G "Unix Makefiles"
            make
            
      - name: Print contents
        run: | 
            ls -la src/hardware/
            find src/hardware


      - name: Upload Artifacts 
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: novuton
          path: | 
                src/hardware/nuvoton**/targets/**/*.hex
                src/hardware/nuvoton**/targets/**/progStLink*.sh
